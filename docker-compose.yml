# Sistema completo: MongoDB + Spark + Dask + API Flask + Jenkins
# Levantar:  docker compose up -d --build
# Presupuesto de memoria (~6,5 GB) pensado para Docker Desktop con ~8 GB.
name: bigdata-geo

# La imagen de Dask se construye una sola vez (en dask-scheduler); workers la reutilizan.
x-dask-image: &dask-image
  image: bigdata-ingest:latest
  pull_policy: never

services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------- Dask: 1 scheduler + 2 workers ----------
  dask-scheduler:
    <<: *dask-image
    build:
      context: ./ingest
    pull_policy: build
    container_name: dask-scheduler
    restart: unless-stopped
    command: ["dask", "scheduler", "--port", "8786", "--dashboard-address", ":8787"]
    ports:
      - "8786:8786"
      - "8787:8787"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8786), 3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  dask-worker-1: &dask-worker
    <<: *dask-image
    container_name: dask-worker-1
    restart: unless-stopped
    command: ["dask", "worker", "tcp://dask-scheduler:8786", "--nthreads", "2", "--memory-limit", "1GB", "--name", "worker-1"]
    environment:
      # Los workers cargan a Mongo directamente; la clave no viaja por el grafo de tareas de Dask.
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-pokemon}
    depends_on:
      dask-scheduler:
        condition: service_healthy
    volumes:
      - ./data:/data
    mem_limit: 1280m

  dask-worker-2:
    <<: *dask-worker
    container_name: dask-worker-2
    command: ["dask", "worker", "tcp://dask-scheduler:8786", "--nthreads", "2", "--memory-limit", "1GB", "--name", "worker-2"]

  # ---------- Ingesta (un solo uso): descarga -> limpieza con Dask (Parquet) -> carga a MongoDB ----------
  # Uso:  docker compose --profile ingest run --rm ingest
  ingest:
    <<: *dask-image
    container_name: ingest
    profiles: ["ingest"]
    command: ["sh", "-c", "python download.py && python clean.py && python load_mongo.py"]
    environment:
      DASK_SCHEDULER: tcp://dask-scheduler:8786
      RAW_DIR: /data/raw
      CLEAN_DIR: /data/clean
      PARQUET_DIR: /data/clean/pokemon_spawns
      CATALOG_FILE: /data/catalog/pokemon_catalog.json
      SAMPLE_STRIDE: ${SAMPLE_STRIDE:-4}
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-pokemon}
    depends_on:
      mongo:
        condition: service_healthy
      dask-scheduler:
        condition: service_healthy
      dask-worker-1:
        condition: service_started
      dask-worker-2:
        condition: service_started
    volumes:
      - ./data:/data
    mem_limit: 768m

  # ---------- Spark: 1 master + 1 worker (el conector de Mongo se pasa con --packages) ----------
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    restart: unless-stopped
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "7077:7077"
      - "8080:8080"
    mem_limit: 512m

  spark-worker:
    image: apache/spark:3.5.3
    container_name: spark-worker
    restart: unless-stopped
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "1g"
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    volumes:
      - ./processing:/opt/jobs:ro
      - ./data:/data:ro      # el benchmark lee el Parquet limpio desde los ejecutores
    mem_limit: 1536m

  # Segundo worker: el benchmark compara 1 worker (2 nucleos) contra 2 workers (4 nucleos), igual que Dask.
  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: spark-worker-2
    restart: unless-stopped
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "1g"
    depends_on:
      - spark-master
    ports:
      - "8083:8081"
    volumes:
      - ./processing:/opt/jobs:ro
      - ./data:/data:ro
    mem_limit: 1536m

  # ---------- Job de Spark (un solo uso): agregaciones espaciales y temporales ----------
  # Uso:  docker compose --profile spark run --rm spark-job
  # El driver corre aqui (modo client); el conector de Mongo se baja con --packages (cache en data/ivy).
  spark-job:
    image: apache/spark:3.5.3
    profiles: ["spark"]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --packages org.mongodb.spark:mongo-spark-connector_2.12:10.4.0
        --conf spark.jars.ivy=/tmp/ivy
        --conf spark.driver.host=$$(hostname -i)
        --conf spark.driver.bindAddress=0.0.0.0
        --conf spark.driver.memory=512m
        --conf spark.executor.memory=768m
        /opt/jobs/jobs/aggregate.py
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-pokemon}
      GRID_DEG: ${GRID_DEG:-0.01}
      HOTSPOT_TOP: ${HOTSPOT_TOP:-200}
    depends_on:
      mongo:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
    volumes:
      - ./processing:/opt/jobs:ro
      - ./data/ivy:/tmp/ivy
    mem_limit: 1024m

  # ---------- Benchmark Dask vs Spark (un solo uso) ----------
  # Uso: benchmark/run_bench.sh  (ejecuta todas las combinaciones y guarda data/benchmark/results.jsonl)
  bench-dask:
    <<: *dask-image
    profiles: ["bench"]
    entrypoint: ["python", "/bench/dask_grid.py"]
    environment:
      DASK_SCHEDULER: tcp://dask-scheduler:8786
    volumes:
      - ./data:/data
      - ./benchmark:/bench:ro
    depends_on:
      - dask-worker-1
      - dask-worker-2
    mem_limit: 512m

  bench-spark:
    image: apache/spark:3.5.3
    profiles: ["bench"]
    user: root          # escribe resultados en ./data/benchmark (creado por el contenedor de Dask, que es root)
    entrypoint: ["sh", "-c"]
    command:
      - >-
        /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --conf spark.driver.host=$$(hostname -i)
        --conf spark.driver.bindAddress=0.0.0.0
        --conf spark.driver.memory=512m
        /bench/spark_grid.py
    environment:
      CORES_MAX: ${CORES_MAX:-2}
      SIZE_FILES: ${SIZE_FILES:-8}
    volumes:
      - ./data:/data
      - ./benchmark:/bench:ro
    depends_on:
      - spark-master
      - spark-worker
      - spark-worker-2
    mem_limit: 768m

  # ---------- API Flask ----------
  api:
    build:
      context: ./api
    image: bigdata-api:latest
    container_name: api
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-pokemon}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------- Jenkins (CI/CD) ----------
  jenkins:
    build:
      context: ./jenkins
    image: bigdata-jenkins:latest
    container_name: jenkins
    restart: unless-stopped
    user: root   # necesario para usar el socket de Docker del host
    ports:
      - "8088:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1024m

  # ---------- Puente de webhooks GitHub -> Jenkins local (opcional) ----------
  # Uso:  docker compose --profile webhook up -d smee   (requiere SMEE_URL en .env)
  smee:
    image: node:20-alpine
    container_name: smee
    profiles: ["webhook"]
    restart: unless-stopped
    environment:
      SMEE_URL: ${SMEE_URL:-}
    command: ["sh", "-c", "[ -n \"$$SMEE_URL\" ] || { echo 'Falta SMEE_URL en .env'; exit 1; }; npm install -g smee-client@2.0.4 >/dev/null 2>&1 && exec smee --url \"$$SMEE_URL\" --target http://jenkins:8080/github-webhook/"]
    depends_on:
      - jenkins
    mem_limit: 128m

volumes:
  mongo_data:
  jenkins_home:
